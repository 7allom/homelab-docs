<svg width="1100" height="800" viewBox="0 0 1100 800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1100" height="800" fill="#0d1117"/>

  <text x="550" y="35" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">Homelab architecture (full)</text>

  <!-- Outer container -->
  <rect x="30" y="60" width="1040" height="710" rx="16" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <text x="50" y="88" fill="#8b949e" font-size="14" font-weight="bold">Home server (CachyOS)</text>

  <!-- Internet -->
  <rect x="470" y="112" width="160" height="44" rx="8" fill="#161b22" stroke="#484f58" stroke-width="1"/>
  <text x="550" y="138" text-anchor="middle" fill="#e6edf3" font-size="13">Internet</text>

  <!-- DuckDNS -->
  <rect x="700" y="104" width="230" height="56" rx="8" fill="#161b22" stroke="#484f58" stroke-width="1"/>
  <text x="815" y="126" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">DuckDNS updater</text>
  <text x="815" y="144" text-anchor="middle" fill="#8b949e" font-size="11">syncs domain to public IP</text>
  <line x1="700" y1="132" x2="630" y2="134" stroke="#484f58" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <line x1="550" y1="156" x2="550" y2="192" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Double NAT -->
  <rect x="410" y="192" width="280" height="56" rx="8" fill="#161b22" stroke="#484f58" stroke-width="1"/>
  <text x="550" y="214" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">Double NAT (ISP → TP-Link)</text>
  <text x="550" y="232" text-anchor="middle" fill="#8b949e" font-size="11">only VPN port forwarded</text>

  <line x1="550" y1="248" x2="550" y2="284" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- UFW -->
  <rect x="430" y="284" width="240" height="56" rx="8" fill="#161b22" stroke="#484f58" stroke-width="1"/>
  <text x="550" y="306" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">UFW firewall</text>
  <text x="550" y="324" text-anchor="middle" fill="#8b949e" font-size="11">only ports 22, 51820 open</text>

  <!-- CrowdSec -->
  <rect x="710" y="284" width="190" height="56" rx="8" fill="#161b22" stroke="#f87171" stroke-width="1.2"/>
  <text x="805" y="306" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">CrowdSec</text>
  <text x="805" y="324" text-anchor="middle" fill="#fca5a5" font-size="11">watches logs, auto-bans</text>
  <line x1="710" y1="312" x2="670" y2="312" stroke="#484f58" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <line x1="550" y1="340" x2="550" y2="376" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AmneziaWG -->
  <rect x="430" y="376" width="240" height="56" rx="8" fill="#161b22" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="550" y="398" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">AmneziaWG VPN</text>
  <text x="550" y="416" text-anchor="middle" fill="#a78bfa" font-size="11">obfuscates traffic vs DPI</text>

  <!-- ntfy -->
  <rect x="710" y="376" width="190" height="44" rx="8" fill="#161b22" stroke="#f87171" stroke-width="1"/>
  <text x="805" y="402" text-anchor="middle" fill="#e6edf3" font-size="12">ntfy (push alerts)</text>
  <line x1="805" y1="340" x2="805" y2="376" stroke="#f87171" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="550" y1="432" x2="550" y2="468" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AdGuard -->
  <rect x="230" y="468" width="180" height="56" rx="8" fill="#161b22" stroke="#484f58" stroke-width="1"/>
  <text x="320" y="490" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">AdGuard DNS</text>
  <text x="320" y="508" text-anchor="middle" fill="#8b949e" font-size="11">rewrites subdomains</text>
  <line x1="410" y1="496" x2="430" y2="496" stroke="#484f58" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Caddy -->
  <rect x="430" y="468" width="240" height="56" rx="8" fill="#161b22" stroke="#2dd4bf" stroke-width="1.2"/>
  <text x="550" y="490" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">Caddy reverse proxy</text>
  <text x="550" y="508" text-anchor="middle" fill="#5eead4" font-size="11">DNS-01 wildcard SSL</text>

  <!-- fan arrows to 6 service boxes -->
  <line x1="550" y1="524" x2="140" y2="560" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="524" x2="304" y2="560" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="524" x2="468" y2="560" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="524" x2="632" y2="560" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="524" x2="796" y2="560" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="524" x2="960" y2="560" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Service tier: 6 boxes -->
  <rect x="65" y="560" width="150" height="60" rx="8" fill="#0d2b26" stroke="#2dd4bf" stroke-width="1"/>
  <text x="140" y="584" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="bold">Media automation</text>
  <text x="140" y="602" text-anchor="middle" fill="#5eead4" font-size="10">Jellyfin, Sonarr, Radarr...</text>

  <rect x="229" y="560" width="150" height="60" rx="8" fill="#0d2b26" stroke="#2dd4bf" stroke-width="1"/>
  <text x="304" y="584" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="bold">Vaultwarden</text>
  <text x="304" y="602" text-anchor="middle" fill="#5eead4" font-size="10">nightly AES-256 backup</text>

  <rect x="393" y="560" width="150" height="60" rx="8" fill="#0d2b26" stroke="#2dd4bf" stroke-width="1"/>
  <text x="468" y="584" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="bold">Samba storage</text>
  <text x="468" y="602" text-anchor="middle" fill="#5eead4" font-size="10">Btrfs qgroup quotas</text>

  <rect x="557" y="560" width="150" height="60" rx="8" fill="#0d2b26" stroke="#2dd4bf" stroke-width="1"/>
  <text x="632" y="584" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="bold">Monitoring</text>
  <text x="632" y="602" text-anchor="middle" fill="#5eead4" font-size="10">Prometheus, Grafana, Alloy</text>

  <rect x="721" y="560" width="150" height="60" rx="8" fill="#0d2b26" stroke="#2dd4bf" stroke-width="1"/>
  <text x="796" y="584" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="bold">Portainer</text>
  <text x="796" y="602" text-anchor="middle" fill="#5eead4" font-size="10">Docker management UI</text>

  <rect x="885" y="560" width="150" height="60" rx="8" fill="#0d2b26" stroke="#2dd4bf" stroke-width="1"/>
  <text x="960" y="584" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="bold">Discord bot</text>
  <text x="960" y="602" text-anchor="middle" fill="#5eead4" font-size="10">host network + AppArmor</text>

  <!-- Backups -->
  <line x1="304" y1="620" x2="304" y2="656" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="175" y="656" width="260" height="50" rx="8" fill="#161b22" stroke="#484f58" stroke-width="1"/>
  <text x="305" y="676" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="bold">Vaultwarden backup</text>
  <text x="305" y="694" text-anchor="middle" fill="#8b949e" font-size="10">AES-256, zero downtime, R2</text>

  <line x1="550" y1="620" x2="740" y2="656" stroke="#484f58" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="600" y="656" width="280" height="50" rx="8" fill="#161b22" stroke="#484f58" stroke-width="1"/>
  <text x="740" y="676" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="bold">Config backup</text>
  <text x="740" y="694" text-anchor="middle" fill="#8b949e" font-size="10">weekly, encrypted, Google Drive</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#484f58" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
